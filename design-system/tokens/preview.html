<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tokens preview</title>
  <link rel="stylesheet" href="../node_modules/@fontsource-variable/bricolage-grotesque/standard.css" />
  <link rel="stylesheet" href="./tokens.css" />
  <style>
    /* Preview page only. Uses tokens for every colour, size and space. */
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-sans); font-optical-sizing: auto; -webkit-font-smoothing: antialiased; }
    .panes { display: grid; grid-template-columns: 1fr 1fr; }
    @media (max-width: 759px) { .panes { grid-template-columns: 1fr; } }
    .pane {
      background: var(--color-bg); color: var(--color-ink);
      padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-7);
      font-size: var(--type-body-size); line-height: var(--type-body-lh);
      transition: background-color var(--dur-colour) var(--ease);
    }
    h1, h2 { margin: 0; }
    .pane-title { font-size: var(--type-display-size); font-weight: var(--type-display-weight); font-stretch: var(--type-display-stretch); line-height: var(--type-display-lh); letter-spacing: var(--type-display-tracking); }
    h2 { font-size: var(--type-title-size); font-weight: var(--type-title-weight); font-stretch: var(--type-title-stretch); line-height: var(--type-title-lh); letter-spacing: var(--type-title-tracking); padding-bottom: var(--space-2); border-bottom: 1px solid var(--color-line); margin-bottom: var(--space-4); }
    .small { font-size: var(--type-small-size); color: var(--color-muted); }
    .label { font-size: var(--type-label-size); font-weight: var(--type-label-weight); }
    .grid { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fill, minmax(calc(var(--space-6) * 5), 1fr)); }
    .sw { display: flex; flex-direction: column; gap: var(--space-1); }
    .chip { height: var(--control-h); border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--color-line-strong); }
    .sw .hex { font-size: var(--type-label-size); color: var(--color-muted); }
    .tag-ext { display: inline-block; margin-left: var(--space-1); padding: 0 var(--space-2); border: 1px solid var(--color-edge); border-radius: var(--radius-pill); font-size: var(--type-label-size); font-weight: var(--type-label-weight); color: var(--color-muted); }
    .acc { padding: var(--space-4); border-radius: var(--radius-md); background: var(--accent-wash); display: flex; flex-direction: column; gap: var(--space-1); }
    .acc b { color: var(--accent-ink); font-size: var(--type-title-size); font-weight: var(--type-title-weight); font-stretch: var(--type-title-stretch); line-height: var(--type-title-lh); }
    .acc span { color: var(--accent-muted); font-size: var(--type-small-size); }
    .acc u { color: var(--accent-text-aa); font-size: var(--type-small-size); font-weight: var(--weight-ui); }
    .acc .exact { color: var(--accent-text); font-size: var(--type-heading-lg-size); font-weight: var(--type-heading-lg-weight); font-stretch: var(--type-heading-lg-stretch); line-height: var(--type-heading-lg-lh); font-style: normal; }
    .acc .why { color: var(--accent-muted); font-size: var(--type-label-size); }
    .role { display: grid; gap: var(--space-1); padding-block: var(--space-3); border-bottom: 1px solid var(--color-line); }
    .role .sample { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar { height: var(--space-3); background: var(--color-ink); border-radius: var(--radius-pill); }
    .row { display: grid; grid-template-columns: calc(var(--space-6) * 3) 1fr; align-items: center; gap: var(--space-3); }
    .boxes { display: flex; flex-wrap: wrap; gap: var(--space-4); }
    .box { width: calc(var(--space-6) * 2); height: calc(var(--space-6) * 2); background: var(--color-surface-1); box-shadow: inset 0 0 0 1px var(--color-line-strong); display: grid; place-items: end start; padding: var(--space-2); font-size: var(--type-label-size); color: var(--color-muted); }
    .elev { background: var(--color-surface-1); border-radius: var(--radius-md); padding: var(--space-4); min-height: calc(var(--space-6) * 3); display: flex; flex-direction: column; gap: var(--space-1); }
    .elev.l4 { background: var(--color-surface-2); }
    .elev.l3 { background: var(--color-surface-2); }
    .panel { background: var(--color-panel-bg); color: var(--color-panel-ink); box-shadow: var(--elev-panel); border-radius: var(--radius-xl); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-3); }
    .panel .muted { color: var(--color-panel-muted); }
    .panel .stat { font-size: var(--type-display-size); font-weight: var(--type-display-weight); font-stretch: var(--type-display-stretch); line-height: var(--type-display-lh); letter-spacing: var(--type-display-tracking); }
    .btns { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; min-height: var(--control-h); padding: 0 var(--space-5);
      border-radius: var(--radius-pill); font: inherit; font-size: var(--type-small-size); font-weight: var(--weight-ui); line-height: 1;
      color: var(--color-ink); background: transparent; border: 1px solid var(--color-edge); cursor: pointer;
      transition: transform var(--dur-press) var(--ease-out), background-color var(--dur-fast);
    }
    .btn.primary { background: var(--color-btn); color: var(--color-on-btn); border-color: var(--color-btn); }
    .btn:hover { background: var(--state-hover-ghost); }
    .btn.primary:hover { background: var(--state-hover-primary); border-color: var(--state-hover-primary); }
    .btn:active { transform: scale(var(--state-press-scale)); }
    .btn:focus-visible { outline: var(--focus-width) solid var(--color-ink); outline-offset: var(--focus-offset); border-radius: var(--radius-pill); }
    .dot { display: inline-block; width: var(--space-2); height: var(--space-2); border-radius: var(--radius-round); background: var(--color-live); }
    table { border-collapse: collapse; width: 100%; font-size: var(--type-small-size); }
    td { padding: var(--space-1) var(--space-2) var(--space-1) 0; border-bottom: 1px solid var(--color-line); }
    td:first-child { color: var(--color-muted); }
  </style>
</head>
<body>
  <div class="panes" id="panes"></div>
  <script type="module">
    import { themed, accents, fixed, roles } from './tokens.mjs';

    const el = (tag, attrs = {}, html = '') => {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
      n.innerHTML = html;
      return n;
    };
    const section = (title, ...kids) => {
      const s = el('section', {}, `<h2>${title}</h2>`);
      kids.forEach((k) => s.append(k));
      return s;
    };

    function pane(theme) {
      const i = theme === 'light' ? 0 : 1;
      const p = el('div', { class: 'pane', 'data-theme': theme });
      p.append(el('h1', { class: 'pane-title' }, theme === 'light' ? 'Light' : 'Dark'));

      // Colour
      const g = el('div', { class: 'grid' });
      for (const [name, t] of Object.entries(themed)) {
        if (!name.startsWith('color-')) continue;
        g.append(el('div', { class: 'sw' },
          `<div class="chip" style="background:var(--${name})"></div>
           <div class="label">${name.replace('color-', '')}${t.ext ? '<span class="tag-ext">ext</span>' : ''}</div>
           <div class="hex">${t[theme]}</div>`));
      }
      p.append(section('Colour', g));

      // Accents
      const a = el('div', { class: 'grid' });
      for (const [name, v] of Object.entries(accents)) {
        a.append(el('div', { class: 'acc', 'data-accent': name },
          `<b>${name}${v.ext ? '<span class="tag-ext">ink and text ext</span>' : ''}</b>
           <i class="exact">Exact ${v.text[i]}</i><span class="why">large text only</span>
           <u>Small text ${v.textAa[i]}${v.textAa[0] !== v.text[0] && i === 0 ? ' (darker, ext)' : ''}</u>
           <span>muted ${v.muted[i]}</span><span>wash ${v.wash[i]}, ink ${v.ink[i]}</span>`));
      }
      p.append(section('Accents (one per screen, orange is the default)', a));

      // Type
      const ty = el('div');
      for (const [name, r] of Object.entries(roles)) {
        const v = `var(--type-${name}`;
        ty.append(el('div', { class: 'role' },
          `<div class="sample" style="font-size:${v}-size);font-weight:${v}-weight);font-stretch:${v}-stretch);line-height:${v}-lh);letter-spacing:${v}-tracking)">Will I travel tonight?</div>
           <div class="small">${name}: ${r.size}, ${r.weight}, ${r.stretch}, ${r.lh}</div>`));
      }
      p.append(section('Type', ty));

      // Spacing
      const sp = el('div', { style: 'display:flex;flex-direction:column;gap:var(--space-2)' });
      for (const name of Object.keys(fixed).filter((n) => n.startsWith('space-'))) {
        sp.append(el('div', { class: 'row' }, `<span class="small">${name} ${fixed[name].value}</span><div class="bar" style="width:var(--${name})"></div>`));
      }
      p.append(section('Spacing', sp));

      // Radius
      const rb = el('div', { class: 'boxes' });
      for (const name of Object.keys(fixed).filter((n) => n.startsWith('radius-'))) {
        rb.append(el('div', { class: 'box', style: `border-radius:var(--${name})` }, `${name.replace('radius-', '')} ${fixed[name].value}`));
      }
      p.append(section('Radius', rb));

      // Elevation
      const eg = el('div', { class: 'grid' });
      const lv = [['elev-0', 'flat'], ['elev-1', 'hairline'], ['elev-2', 'ink ring'], ['elev-3', 'floating'], ['elev-4', 'overlay']];
      for (const [name, what] of lv) {
        eg.append(el('div', { class: `elev ${name === 'elev-3' ? 'l3' : name === 'elev-4' ? 'l4' : ''}`, style: `box-shadow:var(--${name})` },
          `<b>${name}</b><span class="small">${what}</span>`));
      }
      // The no dark on dark check: a card on the page, bordered with line-strong.
      eg.append(el('div', { class: 'elev', style: 'box-shadow:0 0 0 1px var(--color-line-strong)' }, `<b>card</b><span class="small">surface-1 plus line-strong</span>`));
      p.append(section('Elevation and cards', eg));

      // Panel
      p.append(section('Closing panel', el('div', { class: 'panel' },
        `<div class="stat">Hiring, or need a page that sells?</div><div class="muted">Panel colours and border</div>
         <div class="btns"><button class="btn primary" style="background:var(--color-panel-btn);color:var(--color-panel-on-btn);border-color:var(--color-panel-btn)">Book a call</button></div>`)));

      // States
      p.append(section('States (no lift, colour and press only)', el('div', { class: 'btns' },
        `<button class="btn primary">Primary</button><button class="btn">Outline</button><button class="btn" disabled style="opacity:var(--state-disabled-opacity)">Disabled</button>
         <span><i class="dot"></i> live</span><span style="color:var(--color-error)">Error text</span>`)));

      // Motion
      const rows = Object.entries(fixed).filter(([n]) => /^(dur|ease)-?/.test(n) || n === 'ease')
        .map(([n, t]) => `<tr><td>${n}</td><td>${t.value}</td><td>${t.use}</td></tr>`).join('');
      p.append(section('Motion', el('table', {}, rows)));
      return p;
    }
    document.getElementById('panes').append(pane('light'), pane('dark'));
  </script>
</body>
</html>
